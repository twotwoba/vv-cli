name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build & Test
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20, 22]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build CLI
              run: pnpm run build

            - name: Verify CLI works
              run: |
                  node bin/index.js --version
                  node bin/index.js --help

            - name: Test project creation (React)
              run: |
                  mkdir -p /tmp/test-projects
                  cd /tmp/test-projects
                  node ${{ github.workspace }}/bin/index.js test-react-project --template react-desktop
                  cd test-react-project
                  echo "ignore-scripts=false" > .npmrc
                  pnpm install
                  pnpm build

            - name: Test project creation (Vue)
              run: |
                  cd /tmp/test-projects
                  node ${{ github.workspace }}/bin/index.js test-vue-project --template vue-desktop
                  cd test-vue-project
                  echo "ignore-scripts=false" > .npmrc
                  pnpm install
                  pnpm build

            - name: Test project creation (Vue-mobile)
              run: |
                  cd /tmp/test-projects
                  node ${{ github.workspace }}/bin/index.js test-vue-mobile-project --template vue-mobile
                  cd test-vue-mobile-project
                  echo "ignore-scripts=false" > .npmrc
                  pnpm install
                  pnpm build

            - name: Test project creation (Chrome Extension)
              run: |
                  cd /tmp/test-projects
                  node ${{ github.workspace }}/bin/index.js test-ext-project --template chrome-extension
                  cd test-ext-project
                  echo "ignore-scripts=false" > .npmrc
                  pnpm install
                  pnpm build
