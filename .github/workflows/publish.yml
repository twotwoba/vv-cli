name: Publish to npm

on:
    push:
        tags:
            - "v*" # 推送 v 开头的 tag 时自动触发（如 v1.0.0, v2.3.1）
    # 也可以手动触发
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run (不实际发布)"
                required: false
                default: false
                type: boolean

jobs:
    publish:
        name: Publish Package
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write # 用于 npm Trusted Publishers OIDC 认证

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  # 不使用 registry-url，避免创建 .npmrc 干扰 OIDC 认证

            # npm Trusted Publishers 需要 npm 11.5.1+
            - name: Upgrade npm for OIDC support
              run: npm install -g npm@latest

            - name: Verify npm version
              run: npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build CLI
              run: pnpm run build

            - name: Verify CLI works
              run: |
                  node bin/index.js --version
                  node bin/index.js --help

            - name: Publish to npm (Dry Run)
              # 只有手动触发且 dry_run 为 true 时才执行 Dry Run
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
              run: npm publish --dry-run --access public

            - name: Publish to npm
              # Tag 推送时总是发布，手动触发时需要 dry_run 为 false
              if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
              # 使用 --provenance 启用 OIDC 认证和来源证明
              run: npm publish --access public --provenance

            - name: Create publish summary
              run: |
                  echo "## 📦 Package Published!" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Package:** \`@twotwoba/vv-cli\`" >> $GITHUB_STEP_SUMMARY
                  echo "**Version:** \`$(node -p "require('./package.json').version")\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Install" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
                  echo "npm install -g @twotwoba/vv-cli" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
